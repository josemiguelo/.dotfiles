# MacBookPro16,1 (T2) running Omarchy.
extends = ["omarchy"]

[chezmoi]
scripts = ["dotfiles-bootstrap"]

# The key `gh auth login` generated and uploaded (GitHub: "t2-macbook-omarchy");
# key-only SSH for the keys on GitHub (mirrored: deleting one there revokes it).
[ssh]
scripts = ["setup-ssh id_ed25519", "omarchy-sshd josemiguelo"]

# MacBookPro16,1 (T2) hardware.
[t2]
scripts = ["t2-hid-apple-keyboard-arch", "t2-fan-curve", "t2-boot-clock"]

[t2.install]
t2fanrd = "omarchy"

# KVM/QEMU with virt-manager.
[virtualization]
scripts = ["setup-libvirt-arch", "ufw-libvirt"]

[virtualization.install]
libvirt = "omarchy"
qemu-desktop = "omarchy"
virt-manager = "omarchy"
virt-install = "omarchy"
virt-viewer = "omarchy"
dnsmasq = "omarchy"
edk2-ovmf = "omarchy"
swtpm = "omarchy"

# Logitech receiver/mouse manager, without its session autostart.
[solaar]
install = "omarchy"
scripts = ["solaar-no-autostart"]
