# MacBookPro16,1 (T2) running Omarchy.

extends: [omarchy]

install_with:
  omarchy:
    - t2fanrd
    - libvirt
    - qemu-desktop
    - virt-manager
    - virt-install
    - virt-viewer
    - dnsmasq
    - edk2-ovmf
    - swtpm

ssh:
  scripts:
    - setup-ssh id_ed25519
    - omarchy-sshd josemiguelo
t2:
  scripts:
    - t2-hid-apple-keyboard-arch
    - t2-fan-curve
    - t2-boot-clock
    - t2-gmux-backlight
omarchy-apps:
  scripts:
    - omarchy-sudoless-docker
hyprland:
  scripts:
    - omarchy-activity-monitor-size 90% 90%
scratchpad:
  scripts:
    - omarchy-scratchpad-opacity 0.99
virtualization:
  scripts:
    - setup-libvirt-arch
    - ufw-libvirt
solaar:
  install_with: omarchy
  scripts:
    - solaar-no-autostart
