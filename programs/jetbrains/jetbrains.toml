# JetBrains: the Toolbox app and its launchers on PATH. The IdeaVim config is
# a single file in ~ (configs/dot_ideavimrc), so this concern lives here
# rather than beside it. Paths are relative to this file.

[programs.jetbrains-toolbox]
description = "JetBrains Toolbox"

# Linux: per-user install from JetBrains' release feed (see the script for
# why not the ublue-os cask). Version = the build the script recorded.
[programs.jetbrains-toolbox.install.script]
command = "file:install-toolbox.sh install"
check = "file:install-toolbox.sh check"
regex = "([0-9]+\\.[0-9][0-9.]*)"

[programs.jetbrains-toolbox.install.brew-macos]
installer = "brew-cask"

[scripts.link-jetbrains-launchers-linux]
description = "symlink JetBrains Toolbox launcher scripts into ~/.local/bin"
file = "link-launchers.sh"
check = "file:link-launchers.sh check"
after = ["programs.jetbrains-toolbox"]
