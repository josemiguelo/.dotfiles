# Voxtype: push-to-talk speech-to-text, one program with an install per OS.
# On macOS it's a cask from its own tap (peteonrails/voxtype), tapped and
# trusted before the install. On Omarchy it's voxtype-bin from the [omarchy]
# repo, which dictation's fragment (maintenance/dictation) sets up around it.
# After install, `voxtype configure` picks a model, sets the hotkey and walks
# through the microphone and Input Monitoring permissions; that's interactive,
# so it's left to the user.
description: Voxtype push-to-talk speech-to-text
install:

  brew-cask:
    depends-on: [setup-brew]
    command: >-
      sh "$LOADOUT_REPO/programs/brew/brew-taps.sh" install peteonrails/voxtype &&
      sh "$LOADOUT_REPO/programs/brew/brew.sh" install --cask voxtype &&
      cat "$LOADOUT_REPO/programs/apps/voxtype-help.txt"

  omarchy:
    pkg: voxtype-bin
