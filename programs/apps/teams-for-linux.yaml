description: Microsoft Teams client
install:

  # The vendor publishes its own .repo file.
  dnf-repo:
    with:
      repofile: 'https://repo.teamsforlinux.de/rpm/teams-for-linux.repo'

  # Arch: the AUR's prebuilt release (-bin); the source package rebuilds
  # Electron from scratch.
  omarchy-aur:
    pkg: teams-for-linux-bin
