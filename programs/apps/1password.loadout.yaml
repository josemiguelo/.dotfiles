programs:
  1password:
    description: '1Password desktop app'
    install:

      dnf-repo:
        with:
          repofile: 'file:repos/1password.repo'

      # Omarchy ships 1Password in its own [omarchy] repo; the omarchy-1password
      # script finishes the setup with Omarchy's installer.
      omarchy: {}

  1password-cli:
    description: '1Password CLI (op)'
    via: [omarchy, brew-cask]
