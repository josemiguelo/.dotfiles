# Home's pages, left to right: a face, or tiles on a grid of `columns` columns (home.columns in
# ../style/style.toml sets the grid). Moving things on the phone rewrites this file, and home
# follows edits to it. A tile is { widget = "file.owl" }, { app = "…" } or { folder = "name", apps = [...] },
# at x, y (cells from the top left) and w, h wide and tall; without x and y it takes the first free spot.
# A widget file left out stays where it is, and a new one goes by its own page:, order: and size:;
# an app left out comes off home. An app is a package, "pkg/activity" (with "@profile" for a work
# profile's), "linux:<desktop id>" or "owl:<file>".
# What couldn't be read is in errors.txt next to this file.
version = 1
columns = 6

[[page]]
tiles = [
  { widget = "market-simonschubert-today.owl", x = 0, y = 0, w = 6, h = 3 },
  { widget = "30-vault-tasks.owl", x = 0, y = 3, w = 6, h = 4 },
  { app = "com.whatsapp/.Main", x = 0, y = 7 },
  { app = "com.samsung.android.dialer/.DialtactsActivity", x = 1, y = 7 },
  { app = "com.google.android.gm/.ConversationListActivityGmail", x = 2, y = 7 },
  { app = "com.ubercab/.presidio.app.core.root.RootActivity", x = 3, y = 7 },
  { app = "com.brave.browser/com.google.android.apps.chrome.Main", x = 0, y = 8 },
  { app = "com.android.vending/.AssetBrowserActivity", x = 0, y = 10 },
  { app = "linux:new-terminal", x = 1, y = 10 },
  { app = "com.spotify.music/.MainActivity", x = 2, y = 10 },
  { app = "com.azhard.taskforge/.MainActivity", x = 3, y = 10 },
  { app = "com.discord/.main.MainDefault", x = 4, y = 10 },
  { app = "com.google.android.apps.photos/.home.HomeActivity", x = 5, y = 10 },
]

[[page]]
tiles = [
  { widget = "market-nicomaure-speedtest.owl", x = 0, y = 0, w = 6, h = 3 },
]
