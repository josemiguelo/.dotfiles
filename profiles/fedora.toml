# Every Fedora workstation. dnf (with its repos and COPRs) carries system
# packages, brew the tools Fedora lags on, flatpak a few apps. Host-specifics
# (hardware, virtualization choices, ssh key names) live in the machine
# files. No machine runs Fedora today; this keeps one ready.

[dnf.install]
setup-dnf = "dnf"
dnf-plugins-core = "dnf"

[core.install]
curl = "dnf"
git = "dnf"
gcc = "dnf"
procps-ng = "dnf"

[toolchain.install]
development-tools-group = "dnf"
autoconf = "dnf"
patch = "dnf"
rust = "dnf"
findutils = "dnf"
zlib-devel = "dnf"
bzip2-devel = "dnf"
readline-devel = "dnf"
sqlite = "dnf"
sqlite-devel = "dnf"
openssl-devel = "dnf"
xz-devel = "dnf"
libffi-devel = "dnf"
tk-devel = "dnf"
libzstd-devel = "dnf"
libyaml-devel = "dnf"
gdbm-devel = "dnf"
ncurses-devel = "dnf"
dbus-devel = "dnf"
perl-FindBin = "dnf"
libxcrypt-compat = "dnf"

[brew.install]
setup-brew = "script"
brew-taps = "script"

[chezmoi]
install = "brew"
scripts = ["dotfiles-pull", "dotfiles-push", "dotfiles-ssh-remote"]

[git]
scripts = ["setup-git"]

[claude]
scripts = ["skills-repo"]

[zsh]
install = "dnf"
scripts = ["default-shell", "zsh-plugins", "setup-completions"]

[user-environment]
scripts = ["user-environment"]

[fonts]
scripts = ["download-fonts"]

[nvim]
scripts = ["nvim-plugins"]

[kitty]
install = "dnf-copr"

[yazi]
install = "brew"

[workmux]
install = "brew"

[jetbrains]
scripts = ["link-jetbrains-launchers-linux"]

[jetbrains.install]
jetbrains-toolbox = "script"

[tmux]
scripts = ["tmux-plugins"]

[tmux.install]
tmux = "dnf"
tpack = "brew-cask"

# Config-less command-line tools (programs/cli/).
[cli.install]
yq = "brew"
eza = "brew"
awscli = "brew"
atuin = "brew"
trash-cli = "brew"
git-delta = "brew"
ngrok = "script"
just = "dnf"
vim-enhanced = "dnf"
google-cloud-cli = "dnf-repo"

# Desktop apps (programs/apps/); the rpm Firefox wins over the flatpak.
[apps]
scripts = ["remove-firefox-flatpak"]

[apps.install]
vlc = "dnf"
code = "dnf-repo"
antigravity = "dnf-repo"
firefox = "dnf"
1password = "dnf-repo"
google-chrome-stable = "dnf"
slack = "dnf-repo"
anydesk = "dnf"
teams-for-linux = "dnf-repo"
sublime-text = "dnf-repo"
scrcpy = "dnf"
flathub-remote = "flatpak"
obsidian = "flatpak"
