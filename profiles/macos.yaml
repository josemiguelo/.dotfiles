# Every macOS machine. macOS ships zsh as the login shell, so zsh is
# neither installed nor switched to here.

install_with:
  macos:
    - setup-brew
  script:
    - ngrok
  brew-cask:
    - kitty
    - raycast
    - tpack
    - codex
    - 1password-cli
    - jordanbaird-ice
    - lunar
    - meetingbar
    - obs
    - voxtype
  brew:
    - yazi
    - fzf
    - starship
    - workmux
    - atuin
    - bat
    - eza
    - btop
    - fd
    - git-delta
    - gum
    - lazydocker
    - lazygit
    - ripgrep
    - tree-sitter-cli
    - zoxide
    - awscli
    - trash-cli
    - yq
    - azure-cli
    - coreutils
    - gawk
    - gh
    - gnu-sed
    - jira-cli
    - jq
    - qemu
    - tree
    - unixodbc
    - wget
    - terraform
    - try
    - scrcpy

chezmoi:
  install_with: brew
  scripts:
    - dotfiles-pull
    - dotfiles-push
    - dotfiles-ssh-remote
git:
  scripts:
    - setup-git
claude:
  install_with: script
  scripts:
    - skills-repo
zsh:
  scripts:
    - zsh-plugins
    - setup-completions
mise:
  install_with: brew
  scripts:
    - mise-tools
    - mise-default-packages
    - java-macos-integration
nvim:
  scripts:
    - nvim-plugins
fonts:
  scripts:
    - download-fonts
tmux:
  install_with: brew
  scripts:
    - tmux-plugins
