# Every Omarchy machine. System packages install through Omarchy's own
# commands (the built-in omarchy installer); brew only carries tools with no
# trustworthy Arch package.

data:
  omarchy: true

install_with:
  omarchy:
    - curl
    - gcc
    - procps-ng
    - ttf-firacode-nerd
    - yazi
    - fzf
    - starship
    - atuin
    - bat
    - eza
    - btop
    - fd
    - git-delta
    - gum
    - lazydocker
    - lazygit
    - ripgrep
    - tree-sitter-cli
    - zoxide
    - voxtype
    - wtype
    - zenity
    - code
    - sublime-text
    - obsidian
    - spotify
    - vlc
    - 1password
    - 1password-cli
  script:
    - setup-brew
    - brew-taps
    - jetbrains-toolbox
    - ngrok
  brew:
    - workmux
    - awscli
    - just
    - trash-cli
    - yq
    - vim-enhanced
    - scrcpy
  brew-cask:
    - tpack
    - google-cloud-cli
  omarchy-aur:
    - voxtype-tui
    - antigravity
    - slack
    - teams-for-linux
    - anydesk
    - brave

git:
  install_with: omarchy
  scripts:
    - setup-git
chezmoi:
  install_with: omarchy
  scripts:
    - dotfiles-pull
    - dotfiles-push
    - dotfiles-ssh-remote
claude:
  scripts:
    - skills-repo
zsh:
  install_with: omarchy
  scripts:
    - default-shell
    - zsh-plugins
    - setup-completions
mise:
  install_with: omarchy
  scripts:
    - mise-tools
    - mise-default-packages
    - omarchy-default-agent claude
nvim:
  scripts:
    - nvim-plugins
kitty:
  install_with: omarchy
  scripts:
    - omarchy-default-terminal
jetbrains:
  scripts:
    - link-jetbrains-launchers-linux
tmux:
  install_with: omarchy
  scripts:
    - tmux-plugins
    - omarchy-tmux-theme
keychron:
  scripts:
    - keychron-launcher-access
hyprland:
  scripts:
    - omarchy-hypr-config input looknfeel
    - omarchy-close-window-key
    - omarchy-google-bindings
    - omarchy-harpoon
shell:
  scripts:
    - omarchy-bar bottom 24 tornikegomareli.spaces
    - "omarchy-plugins
     https://github.com/evindor/keystroke.git
     https://github.com/jankeesvw/omarchy-notification-center.git
     https://github.com/tornikegomareli/omarchy-spaces.git
     https://github.com/binoymanoj/pomodoro-omarchy.git
     https://github.com/Zeus-Deus/voxtype-omarchy-plugin.git
     https://github.com/crmne/omarchy-mpris.git"
    - "omarchy-bar-icons
     josemiguelo.menu-button
     josemiguelo.workspace-layout
     omarchy.monitor
     omarchy.bluetooth
     omarchy.network
     omarchy.audio
     omarchy.power
     omarchy.agents
     omarchy.system-update
     omarchy.indicators
     omarchy.weather
     omarchy.tray
     jankeesvw.notification-center
     io.github.zeus-deus.voxtype
     pomodoro-omarchy
     crmne.mpris
     omarchy.clock
     tornikegomareli.spaces"
    - omarchy-menu-button
    - "omarchy-bar-widgets
     josemiguelo.workspace-layout left before tornikegomareli.spaces
     josemiguelo.menu-button left before josemiguelo.workspace-layout
     crmne.mpris left after tornikegomareli.spaces"
    - omarchy-keystroke-windows
    - omarchy-pomodoro
omarchy-apps:
  scripts:
    - omarchy-1password
    - omarchy-default-browser-arch brave
    - omarchy-vscode
    - omarchy-brave
    - omarchy-agent-launchers-prune claude codex gh gemini
webapps:
  scripts:
    - omarchy-webapps-remove Basecamp HEY
    - omarchy-webapp-gmail
    - omarchy-webapp-google-calendar
omarchy-overrides:
  scripts:
    - omarchy-command-overrides
    - omarchy-keyboard-backlight-guard
dictation:
  scripts:
    - omarchy-dictation
    - omarchy-dictation-gpu
