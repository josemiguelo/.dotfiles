# Every macOS machine. macOS ships zsh as the login shell, so zsh is
# neither installed nor switched to here.

[brew.install]
setup-brew = "macos"
brew-taps = "script"

[chezmoi]
install = "brew"
scripts = ["dotfiles-bootstrap", "dotfiles-pull", "dotfiles-push", "dotfiles-apply", "dotfiles-ssh-remote"]

[git]
scripts = ["setup-git"]

[claude]
scripts = ["skills-repo"]

[zsh]
scripts = ["zsh-plugins", "setup-completions"]

[mise]
install = "brew"
scripts = ["mise-tools", "mise-default-packages", "java-macos-integration"]

[nvim]
scripts = ["nvim-plugins"]

[kitty]
install = "brew-cask"

[raycast]
install = "brew-cask"

[fonts]
scripts = ["download-fonts"]

[yazi]
install = "brew"

[fzf]
install = "brew"

[starship]
install = "brew"

[workmux]
install = "brew"

[tmux]
scripts = ["tmux-plugins"]

[tmux.install]
tmux = "brew"
tpack = "brew-cask"

# Config-less command-line tools (programs/cli/).
[cli.install]
atuin = "brew"
bat = "brew"
btop = "brew"
fd = "brew"
git-delta = "brew"
gum = "brew"
lazydocker = "brew"
lazygit = "brew"
ripgrep = "brew"
tree-sitter-cli = "brew"
zoxide = "brew"
awscli = "brew"
trash-cli = "brew"
yq = "brew"
azure-cli = "brew"
coreutils = "brew"
gawk = "brew"
gh = "brew"
gnu-sed = "brew"
jira-cli = "brew"
jq = "brew"
qemu = "brew"
tree = "brew"
unixodbc = "brew"
wget = "brew"
terraform = "brew"
claude = "script"
codex = "brew-cask"
ngrok = "script"
try = "brew"

# Desktop apps (programs/apps/).
[apps.install]
1password-cli = "brew-cask"
jordanbaird-ice = "brew-cask"
lunar = "brew-cask"
meetingbar = "brew-cask"
obs = "brew-cask"
scrcpy = "brew"
