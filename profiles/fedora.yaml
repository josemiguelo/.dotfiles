# Every Fedora workstation. dnf (with its repos and COPRs) carries system
# packages, brew the tools Fedora lags on, flatpak a few apps. Host-specifics
# (hardware, virtualization choices, ssh key names) live in the machine
# files. No machine runs Fedora today; this keeps one ready.

install_with:
  dnf:
    - setup-dnf
    - dnf-plugins-core
    - curl
    - gcc
    - procps-ng
    - development-tools-group
    - autoconf
    - patch
    - rust
    - findutils
    - zlib-devel
    - bzip2-devel
    - readline-devel
    - sqlite
    - sqlite-devel
    - openssl-devel
    - xz-devel
    - libffi-devel
    - tk-devel
    - libzstd-devel
    - libyaml-devel
    - gdbm-devel
    - ncurses-devel
    - dbus-devel
    - perl-FindBin
    - libxcrypt-compat
    - just
    - vim-enhanced
    - vlc
    - firefox
    - google-chrome-stable
    - anydesk
    - scrcpy
  script:
    - setup-brew
    - brew-taps
    - jetbrains-toolbox
    - ngrok
  dnf-copr:
    - kitty
  brew:
    - yazi
    - workmux
    - yq
    - eza
    - awscli
    - atuin
    - trash-cli
    - git-delta
  brew-cask:
    - tpack
  dnf-repo:
    - google-cloud-cli
    - code
    - antigravity
    - 1password
    - slack
    - teams-for-linux
    - sublime-text
  flatpak:
    - flathub-remote
    - obsidian

git:
  install_with: dnf
  scripts:
    - setup-git
chezmoi:
  install_with: brew
  scripts:
    - dotfiles-pull
    - dotfiles-push
    - dotfiles-ssh-remote
claude:
  scripts:
    - skills-repo
zsh:
  install_with: dnf
  scripts:
    - default-shell
    - zsh-plugins
    - setup-completions
user-environment:
  scripts:
    - user-environment
fonts:
  scripts:
    - download-fonts
nvim:
  scripts:
    - nvim-plugins
jetbrains:
  scripts:
    - link-jetbrains-launchers-linux
tmux:
  install_with: dnf
  scripts:
    - tmux-plugins
apps:
  scripts:
    - remove-firefox-flatpak
