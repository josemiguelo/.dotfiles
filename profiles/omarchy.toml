# Every Omarchy machine. System packages install through Omarchy's own
# commands (the built-in omarchy installer); brew only carries tools with no
# trustworthy Arch package.

[core.install]
curl = "omarchy"
git = "omarchy"
gcc = "omarchy"
procps-ng = "omarchy"

[brew.install]
setup-brew = "script"
brew-taps = "script"

[chezmoi]
install = "omarchy"
scripts = ["dotfiles-pull", "dotfiles-apply", "dotfiles-push", "dotfiles-ssh-remote"]

[zsh]
install = "omarchy"
scripts = ["default-shell", "zsh-plugins", "setup-completions"]

[mise]
install = "omarchy"
scripts = ["mise-tools", "mise-default-packages", "omarchy-default-agent claude"]

[nvim]
scripts = ["nvim-plugins"]

[kitty]
scripts = ["omarchy-default-terminal"]

[kitty.install]
kitty = "omarchy"
ttf-firacode-nerd = "omarchy"

[yazi]
install = "omarchy"

[fzf]
install = "omarchy"

[starship]
install = "omarchy"

[workmux]
install = "brew"

[jetbrains]
scripts = ["link-jetbrains-launchers-linux"]

[jetbrains.install]
jetbrains-toolbox = "script"

[tmux]
scripts = ["tmux-plugins", "omarchy-tmux-theme"]

[tmux.install]
tmux = "omarchy"
tpack = "brew-cask"

# Config-less command-line tools (programs/cli/).
[cli.install]
atuin = "omarchy"
bat = "omarchy"
btop = "omarchy"
fd = "omarchy"
git-delta = "omarchy"
gum = "omarchy"
lazydocker = "omarchy"
lazygit = "omarchy"
ripgrep = "omarchy"
tree-sitter-cli = "omarchy"
zoxide = "omarchy"
awscli = "brew"
just = "brew"
trash-cli = "brew"
yq = "brew"
vim-enhanced = "brew"
google-cloud-cli = "brew-cask"
ngrok = "script"

[data]
omarchy = true
