# Every Omarchy machine. System packages install through Omarchy's own
# commands (the built-in omarchy installer); brew only carries tools with no
# trustworthy Arch package.

[core.install]
curl = "omarchy"
git = "omarchy"
gcc = "omarchy"
procps-ng = "omarchy"

[brew.install]
setup-brew = "script"
brew-taps = "script"

[zsh]
install = "omarchy"
scripts = ["default-shell", "zsh-plugins", "setup-completions"]

[kitty]
scripts = ["omarchy-default-terminal"]

[kitty.install]
kitty = "omarchy"
ttf-firacode-nerd = "omarchy"

[tmux]
scripts = ["tmux-plugins", "omarchy-tmux-theme"]

[tmux.install]
tmux = "omarchy"
tpack = "brew-cask"

[data]
omarchy = true
