# Every Omarchy machine. System packages install through Omarchy's own
# commands (the built-in omarchy installer); brew only carries tools with no
# trustworthy Arch package.

[core.install]
curl = "omarchy"
git = "omarchy"
gcc = "omarchy"
procps-ng = "omarchy"

[brew.install]
setup-brew = "script"
brew-taps = "script"

[chezmoi]
install = "omarchy"
scripts = ["dotfiles-pull", "dotfiles-apply", "dotfiles-push", "dotfiles-ssh-remote"]

[git]
scripts = ["setup-git"]

[zsh]
install = "omarchy"
scripts = ["default-shell", "zsh-plugins", "setup-completions"]

[mise]
install = "omarchy"
scripts = ["mise-tools", "mise-default-packages", "omarchy-default-agent claude"]

[nvim]
scripts = ["nvim-plugins"]

[kitty]
scripts = ["omarchy-default-terminal"]

[kitty.install]
kitty = "omarchy"
ttf-firacode-nerd = "omarchy"

[yazi]
install = "omarchy"

[fzf]
install = "omarchy"

[starship]
install = "omarchy"

[workmux]
install = "brew"

[jetbrains]
scripts = ["link-jetbrains-launchers-linux"]

[jetbrains.install]
jetbrains-toolbox = "script"

[tmux]
scripts = ["tmux-plugins", "omarchy-tmux-theme"]

[tmux.install]
tmux = "omarchy"
tpack = "brew-cask"

# Config-less command-line tools (programs/cli/).
[cli.install]
atuin = "omarchy"
bat = "omarchy"
btop = "omarchy"
fd = "omarchy"
git-delta = "omarchy"
gum = "omarchy"
lazydocker = "omarchy"
lazygit = "omarchy"
ripgrep = "omarchy"
tree-sitter-cli = "omarchy"
zoxide = "omarchy"
awscli = "brew"
just = "brew"
trash-cli = "brew"
yq = "brew"
vim-enhanced = "brew"
google-cloud-cli = "brew-cask"
ngrok = "script"

[keychron]
scripts = ["keychron-launcher-access"]

# Hyprland: settings from hypr-config/ (natural scrolling, look and feel),
# SUPER+Q to close, Google in HEY's place, Hyper+letter app hotkeys.
[hyprland]
scripts = [
  "omarchy-hypr-config input looknfeel",
  "omarchy-close-window-key",
  "omarchy-google-bindings",
  "omarchy-harpoon",
]

# Local replacements of Omarchy commands, first on the session PATH.
[omarchy-overrides]
scripts = ["omarchy-command-overrides", "omarchy-keyboard-backlight-guard"]

[dictation]
scripts = ["omarchy-dictation", "omarchy-dictation-gpu"]

[dictation.install]
voxtype = "omarchy"
wtype = "omarchy"
zenity = "omarchy"
voxtype-tui = "omarchy-aur"

# Desktop apps (programs/apps/). AUR ones were each approved by hand.
[apps.install]
code = "omarchy"
sublime-text = "omarchy"
obsidian = "omarchy"
spotify = "omarchy"
vlc = "omarchy"
1password = "omarchy"
1password-cli = "omarchy"
antigravity = "omarchy-aur"
slack = "omarchy-aur"
teams-for-linux = "omarchy-aur"
anydesk = "omarchy-aur"
brave = "omarchy-aur"
scrcpy = "brew"

[data]
omarchy = true
