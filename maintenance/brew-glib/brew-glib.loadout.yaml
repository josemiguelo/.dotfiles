scripts:
  # Linux: brew's glib unlinked, so the system's gsettings, gio and gdbus are
  # the ones on PATH. Mapped by profiles/omarchy.yaml and profiles/fedora.yaml.
  unlink-brew-glib:
    description: 'brew''s glib unlinked (the system''s gsettings reaches dconf)'
    file: unlink-brew-glib.sh
    check: 'file:unlink-brew-glib.sh check'
