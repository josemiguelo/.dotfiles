scripts:
  # The Omarchy shell: plugins, the bar (position, widgets, icons, the menu
  # button), the Pomodoro timer and Keystroke's Windows extension. Paths are
  # relative to this file; keystroke-windows sources ../lib/.

  # Omarchy shell plugins from git, named by URL in the machine's opt-in, one
  # per line ('''omarchy-plugins <url> <url>…'''): each one installed and
  # enabled the Omarchy way. One entry for the whole list.
  omarchy-plugins:
    description: Omarchy shell plugins installed and enabled
    file: omarchy-plugins.sh
    check: 'file:omarchy-plugins.sh check $@'

  # The Omarchy bar's position and thickness, and optionally a widget that
  # replaces the stock workspace numbers, named by the opt-in
  # ("omarchy-bar bottom 30 <widget-id>": at the bottom, 30 at font base-size
  # 12), with that widget's settings from omarchy-bar/settings/<widget-id>.json.
  # The widget comes from omarchy-plugins, hence after it.
  omarchy-bar:
    description: 'Omarchy bar position, thickness, workspace widget and its settings'
    file: omarchy-bar.sh
    check: 'file:omarchy-bar.sh check $@'
    after: [scripts.omarchy-plugins]

  # Bar widgets with SVG icons instead of glyphs, named in the opt-in
  # ("omarchy-bar-icons omarchy.monitor …"), by
  # github.com/josemiguelo/omarchy-bar-icons: its own widgets, and the others
  # rebuilt from their source (Omarchy's, or a third-party plugin's checkout from
  # omarchy-plugins, hence after it) with its patches, in the original's place
  # on the bar. An Omarchy, plugin or repo update that changes a widget makes it
  # not done until the next run rebuilds it.
  omarchy-bar-icons:
    description: 'Bar widgets with SVG icons, rebuilt from their source'
    file: omarchy-bar-icons.sh
    check: 'file:omarchy-bar-icons.sh check $@'
    after: [scripts.omarchy-plugins]

  # Where bar widgets from omarchy-plugins and omarchy-bar-icons sit, one per
  # line of the opt-in:
  # "<id> <section> <before|after> <neighbour-id>", with each widget's settings
  # from omarchy-bar/settings/<id>.json when it has one.
  omarchy-bar-widgets:
    description: 'Bar widgets'' places and settings'
    file: omarchy-bar-widgets.sh
    check: 'file:omarchy-bar-widgets.sh check $@'
    after: [scripts.omarchy-plugins, scripts.omarchy-bar-icons]

  # The menu button (josemiguelo.menu-button, from omarchy-bar-icons) in the
  # place of Keystroke's own bar button, with Keystroke (from omarchy-plugins)
  # kept as the menu; hence after both.
  omarchy-menu-button:
    description: 'The menu button in the place of Keystroke''s bar button'
    file: omarchy-menu-button.sh
    check: 'file:omarchy-menu-button.sh check'
    after: [scripts.omarchy-plugins, scripts.omarchy-bar-icons]

  # The Pomodoro timer plugin (from omarchy-plugins, or its omarchy-bar-icons
  # clone once that has its place; hence after both): next to the bar's clock,
  # its settings from omarchy-pomodoro/, and a Pomodoro submenu under Trigger
  # in the Omarchy menu.
  omarchy-pomodoro:
    description: 'Pomodoro timer: by the clock, 50+10, Trigger menu entries'
    file: omarchy-pomodoro.sh
    check: 'file:omarchy-pomodoro.sh check'
    after: [scripts.omarchy-plugins, scripts.omarchy-bar-icons]

  # Keystroke's Windows extension from a checkout (~/Repos/gh/evindor/keystroke)
  # until it ships with Keystroke: linked, turned on, and opened by Hyper+Space.
  omarchy-keystroke-windows:
    description: 'Hyper+Space lists every window, by workspace (Keystroke)'
    file: omarchy-keystroke-windows.sh
    check: 'file:omarchy-keystroke-windows.sh check'
    after: [scripts.omarchy-plugins]
outdated:

  # Are the Omarchy shell plugins behind their remotes?
  omarchy-plugins:
    command: 'file:outdated-plugins.sh'
    upgrade: 'file:outdated-plugins.sh update {item}'
