scripts:
  # Kitty windows in the scratchpad (SUPER+S) at the opacity the opt-in names
  # ("omarchy-scratchpad-opacity 0.95"), the rest at kitty.conf's
  # background_opacity. Needs dynamic_background_opacity, which kitty.conf
  # sets on Omarchy machines. The script sources ../lib/ and writes its own
  # path into Omarchy's theme-set and font-set hooks.

  omarchy-scratchpad-opacity:
    description: scratchpad kitty windows less see-through
    file: omarchy-scratchpad-opacity.sh
    check: 'file:omarchy-scratchpad-opacity.sh check $@'
    after: [programs.kitty]
