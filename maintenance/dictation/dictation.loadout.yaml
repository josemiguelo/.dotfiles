programs:
  # Dictation (Omarchy): Voxtype push-to-talk, set up by Omarchy's own
  # installer and moved onto the GPU. Paths are relative to this file.

  # The package Omarchy's dictation installer (omarchy-voxtype-install) adds
  # beside voxtype-bin: wtype, which types the text into the focused window.
  # voxtype itself is programs/apps/voxtype.yaml's.
  wtype:
    description: 'xdotool type for Wayland (voxtype''s typing backend)'
    via: [omarchy]

  # What the Voxtype bar plugin (omarchy-plugins) drives: voxtype-tui, the
  # Textual TUI whose Python package does the plugin's config writes (AUR, by
  # the plugin's author), and zenity for the plugin's Import file chooser.
  voxtype-tui:
    description: 'Voxtype''s settings TUI and the Voxtype plugin''s backend'
    install:

      omarchy-aur:
        pkg: voxtype-tui

  zenity:
    description: 'GTK dialogs from scripts (the Voxtype plugin''s file chooser)'
    via: [omarchy]
scripts:

  # Voxtype dictation through Omarchy's own installer, which asks before its
  # ~150MB model download.
  omarchy-dictation:
    description: 'Voxtype dictation, set up by Omarchy''s installer'
    file: dictation.sh
    check: 'file:dictation.sh check'
    after: [programs.voxtype, programs.wtype]

  # Voxtype's Vulkan build instead of the CPU one, then the service restarted
  # onto it. Omarchy's installer attempts the switch without sudo and lets it
  # fail.
  omarchy-dictation-gpu:
    description: 'Voxtype dictation on the GPU (Vulkan)'
    file: dictation-gpu.sh
    check: 'file:dictation-gpu.sh check'
    after: [scripts.omarchy-dictation]
