# Every Gradle build's settings. Gradle doesn't look in mise's installs for
# toolchains: zsh's java plugin exports JDK<major>_HOME for each Java version
# mise installed, and Gradle reads the ones listed here. A new Java major in
# mise's config.toml needs its JDK<major>_HOME added here too.
# Secrets (signing keys, tokens) don't go here: chezmoi owns this file, and
# would show them as a diff to revert. ORG_GRADLE_PROJECT_<name> carries them.
org.gradle.java.installations.fromEnv=JDK8_HOME,JDK11_HOME,JDK17_HOME,JDK21_HOME
