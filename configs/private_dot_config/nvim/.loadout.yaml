scripts:
  # nvim: the lazy.nvim plugins lazy-lock.json locks. Neovim itself (nightly)
  # comes from mise's config.toml. Its dotfiles are this directory; paths below
  # are relative to this file.

  # Plugin clones at the commits lazy-lock.json locks.
  nvim-plugins:
    description: lazy.nvim plugins at the commits lazy-lock.json locks
    file: '.loadout/plugins.sh'
    check: 'file:.loadout/plugins.sh check'
    after: [scripts.mise-tools]
outdated:

  # Which lazy.nvim plugins does Lazy itself consider outdated? Asks Lazy via a
  # headless nvim (honours each plugin's version/tag/commit/branch/pin) rather
  # than a raw HEAD-vs-default-branch diff, which false-flagged every semver-
  # pinned plugin. One plugin per row, because Lazy's update is per plugin and a
  # plugin that fails to fetch must not take the others with it. The update
  # runs through Lazy too, so the lockfile keeps a single writer; bring it back
  # into the repo afterwards with `chezmoi re-add`.
  nvim-plugins:
    command: 'file:.loadout/plugins.sh outdated'
    upgrade: 'file:.loadout/plugins.sh update {item}'
