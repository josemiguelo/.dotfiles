# Flags /usr/bin/spotify adds to every launch; it drops # lines, not blank ones.
# Run natively on Wayland: under XWayland (Spotify's default), Mesa's EGL
# picks its Wayland path inside the X11 GPU process and segfaults
# (dri2_initialize_wayland, Mesa 26.2.5, Spotify 1.3.4).
--enable-features=UseOzonePlatform
--ozone-platform=wayland
