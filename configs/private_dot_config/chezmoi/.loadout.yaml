programs:
  # chezmoi: the dotfiles manager and its checkout (this repo). Its own config
  # is this directory; paths below are relative to this file. loadout applies
  # the dotfiles itself (`sync`, `apply`, the home screen's configs row); these
  # scripts watch the checkout's git side, which loadout doesn't report.

  chezmoi:
    via: [brew, omarchy]
scripts:

  # The checkout pulls over https and pushes over ssh: the repo is public, so
  # pulling works before GitHub knows this machine's key (github-ssh-key).
  dotfiles-ssh-remote:
    description: point the chezmoi checkout's pushes at the ssh dotfiles remote
    run: 'git -C $HOME/.local/share/chezmoi remote set-url origin https://github.com/josemiguelo/.dotfiles.git && git -C $HOME/.local/share/chezmoi config remote.origin.pushurl git@github.com:josemiguelo/.dotfiles.git'
    check: 'test "$(git -C $HOME/.local/share/chezmoi config --get remote.origin.url)" = https://github.com/josemiguelo/.dotfiles.git && test "$(git -C $HOME/.local/share/chezmoi config --get remote.origin.pushurl)" = git@github.com:josemiguelo/.dotfiles.git'

  # Remote freshness: is the local source behind origin? (throttled fetch,
  # fail-soft offline). Converge = pull only; applying is loadout's job.
  dotfiles-pull:
    description: pull dotfiles source when behind its origin
    file: '.loadout/pull.sh'
    check: 'file:.loadout/pull.sh check'
    modes: [maintain]

  # Outbound freshness: local edits/commits origin hasn't seen. Ordered after
  # dotfiles-pull so one maintain run pulls (rebasing the view) before pushing.
  dotfiles-push:
    description: push dotfiles source when ahead of its origin
    file: '.loadout/push.sh'
    check: 'file:.loadout/push.sh check'
    after: [scripts.dotfiles-pull]
    modes: [maintain]
