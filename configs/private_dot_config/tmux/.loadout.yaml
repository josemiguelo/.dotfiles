programs:
  # tmux: the multiplexer, its plugin manager and plugins, and (on Omarchy)
  # keeping kitty's palette across theme switches. Its dotfile is tmux.conf.tmpl
  # beside this file; paths below are relative to this file.

  # brew on macOS; on Omarchy tmux is a base package, mapped to Omarchy's own
  # installer so workmux resolves it without brew installing a second copy.
  tmux:
    via: [brew, dnf, omarchy]

  # macOS: from its tap, so the full tap path is required, and the tap is
  # tapped and trusted first; it ships as a cask, so brew-cask mechanics
  # observe it. Linux: from its GitHub release, since the cask depends on
  # brew's tmux and git, which would shadow the system's on PATH.
  tpack:
    description: tmux package manager
    install:

      brew-cask:
        command: >-
          sh "$LOADOUT_REPO/programs/01-brew/brew-taps.sh" install tmuxpack/tpack &&
          sh "$LOADOUT_REPO/programs/01-brew/brew.sh" install tmuxpack/tpack/tpack

      # Its own copy only: a tpack on PATH may still be the cask's, which
      # remove-brew-tmux takes away after this.
      script:
        command: 'file:.loadout/install-tpack.sh'
        check: '$HOME/.local/bin/tpack --version'
        regex: '([0-9]+\.[0-9][0-9.]*)'
scripts:

  # The plugins tmux.conf declares, present as clones. Whether a clone is
  # behind its remote is the tmux-plugins oracle's question.
  tmux-plugins:
    description: tmux plugins tmux.conf declares
    file: '.loadout/plugins.sh'
    check: 'file:.loadout/plugins.sh check'
    after: [programs.tmux, programs.tpack]

  # Linux: brew's tpack cask gone, and the tmux and git it pulled in, so the
  # system's tmux and git are the ones on PATH.
  remove-brew-tmux:
    description: 'no tpack, tmux or git from brew (Linux has its own)'
    file: '.loadout/remove-brew-tmux.sh'
    check: 'file:.loadout/remove-brew-tmux.sh check'
    after: [programs.tpack]

  # Omarchy only: omarchy-theme-set-tmux repaints the live tmux server with the
  # omarchy theme on every theme switch, while tmux here follows kitty's palette.
  # Installs a theme-set hook that undoes it after each switch.
  omarchy-tmux-theme:
    description: 'tmux keeps kitty''s palette across omarchy theme switches'
    file: '.loadout/omarchy-theme.sh'
    check: 'file:.loadout/omarchy-theme.sh check'
    after: [programs.tmux]
outdated:

  # Are the tmux plugin clones behind their GitHub tips?
  tmux-plugins:
    command: 'file:.loadout/outdated-plugins.sh'
    upgrade: 'file:.loadout/outdated-plugins.sh update {item}'
